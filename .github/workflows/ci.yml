name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads. The three container jobs additionally pull the
# dev image from GHCR, which is what `packages: read` covers.
permissions:
  contents: read
  packages: read

# The `credentials:` on each container job are needed while the GHCR package
# is private. They are harmless once it is public, and public is what lets
# pull requests from forks pull the image at all.
jobs:
  default:
    name: default options
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/owl-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  full:
    name: all libraries + live services
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/owl-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: owl
          POSTGRES_PASSWORD: owl
          POSTGRES_DB: owl_test
        options: >-
          --health-cmd "pg_isready -U owl -d owl_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      # Service containers are reachable by service name from a container job.
      OWL_TEST_PSQL_DSN: postgres://owl:owl@postgres:5432/owl_test
      OWL_TEST_REDIS: redis:6379
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DOWL_ENABLE_PROMETHEUS=ON \
              -DOWL_ENABLE_POSTGRESQL=ON \
              -DOWL_ENABLE_REDIS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  asan:
    name: asan + ubsan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/owl-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DOWL_ENABLE_PROMETHEUS=ON \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
      - run: cmake --build build
      # Hermetic tests only: the live-service tests skip themselves without
      # OWL_TEST_PSQL_DSN / OWL_TEST_REDIS, which is what we want here.
      - run: ctest --test-dir build --output-on-failure -j "$(nproc)"
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  e2e:
    name: end-to-end (rest example)
    # The one job that does not run in the dev image: docker compose needs a
    # Docker daemon, and a container job does not have one.
    runs-on: ubuntu-latest
    env:
      # Compose reads this, so every call below is a bare `docker compose`.
      COMPOSE_FILE: examples/rest/docker-compose.yml:.github/compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # examples/rest/Dockerfile installs dependencies and builds h2o before
      # COPY . /src, so those layers restore from cache and only rebuild when
      # the Dockerfile itself changes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/rest/Dockerfile
          tags: owl-rest:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack
        run: docker compose up -d --no-build

      # Any HTTP response means the server is accepting connections; the route
      # itself need not exist, and `curl -s` without -f exits 0 on 4xx/5xx.
      # On timeout the step fails and the `Logs on failure` step below runs.
      - name: Wait for the API
        run: timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:8080/; do sleep 1; done'

      # Phase 1 only: the chaos phase (--compose) restarts services under load
      # and is too timing-sensitive for a required check. See monkey.py.
      - name: Monkey test
        run: python3 examples/rest/monkey.py http://localhost:8080 --seed 1

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
